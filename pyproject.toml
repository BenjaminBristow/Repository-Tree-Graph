[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rptree"
version = "1.3.0"
description = "A command-line tool that generates a tree diagram of files and directories."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
rptree = "rptree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
